services:
  - type: web
    name: lubriexpert-backend
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER
        value: gemini
      - key: AI_MODEL
        value: gemini-3.8-flash
      - key: AI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: FRONTEND_URL
        value: "*"
      - key: AI_API_KEY
        sync: false

  - type: web
    name: lubriexpert-frontend
    runtime: static
    rootDir: frontend
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    staticPublishPath: dist/frontend/browser
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
